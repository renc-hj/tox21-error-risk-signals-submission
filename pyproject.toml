[project]
name = "tox21-error-risk-signals"
version = "0.1.0"
description = "Controlled analysis of toxicity error-risk signals under molecular structural shift"
requires-python = ">=3.11,<3.12"
dependencies = [
    "matplotlib>=3.9,<4",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pyyaml>=6.0,<7",
    "rdkit>=2024.3,<2027",
    "scikit-learn>=1.5,<2",
    "seaborn>=0.13,<1",
    "torch>=2.5,<3",
    "torch-geometric>=2.6,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]
presentation = [
    "lectrace>=1.1.30",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
